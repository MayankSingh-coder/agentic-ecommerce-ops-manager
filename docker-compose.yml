services:
  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg://ecommerce_ops:ecommerce_ops@postgres:5432/ecommerce_ops
      ECOMMERCE_OPS_API_KEY: ${ECOMMERCE_OPS_API_KEY:-}
      LLM_GATEWAY_PROVIDER: ${LLM_GATEWAY_PROVIDER:-prompt}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://litellm:4000}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-sk-local-litellm}
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: ecommerce-ops-task-queue
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/v1/ecommerce-ops/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  temporal-worker:
    build: .
    command: ["python", "-m", "app.temporal.worker"]
    restart: on-failure
    depends_on:
      api:
        condition: service_healthy
      temporal:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg://ecommerce_ops:ecommerce_ops@postgres:5432/ecommerce_ops
      ECOMMERCE_OPS_API_KEY: ${ECOMMERCE_OPS_API_KEY:-}
      LLM_GATEWAY_PROVIDER: ${LLM_GATEWAY_PROVIDER:-prompt}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://litellm:4000}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-sk-local-litellm}
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: ecommerce-ops-task-queue

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ecommerce_ops
      POSTGRES_PASSWORD: ecommerce_ops
      POSTGRES_DB: ecommerce_ops
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce_ops"]
      interval: 5s
      timeout: 5s
      retries: 10

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_API_KEY:-sk-local-litellm}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    ports:
      - "4000:4000"

  temporal:
    image: temporalio/auto-setup:1.25
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ecommerce_ops
      POSTGRES_PWD: ecommerce_ops
      POSTGRES_SEEDS: postgres
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:2.31.2
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
